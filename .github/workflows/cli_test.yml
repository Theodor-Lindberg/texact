name: cli-test

on:
  push:
    paths:
      - 'source/**'
  pull_request:
    paths:
      - 'source/**'

jobs:
  cli-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Check texact help
        run: texact -h

      - name: Run texact on each LaTeX file, making sure nothing crashes
        run: python -m pytest -q test/test.py
